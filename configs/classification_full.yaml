name: contrast_and_reinforce
task: emotion_classification
model_name: Qwen/Qwen2.5-3B
output_dir: outputs/classification/contrast_and_reinforce
train_size: 6000
validation_size: 200
test_size: 500
reward_size: 600
max_source_length: 96
max_target_length: 8
max_new_tokens: 6
epochs: 4
batch_size: 8
