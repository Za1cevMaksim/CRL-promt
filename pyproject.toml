[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crl-prompt-dialogue"
version = "1.0.0"
description = "CRL-Prompt transfer experiments for empathetic dialogue generation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Максим Зайцев"}]
dependencies = [
  "torch==2.11.0",
  "transformers==5.15.0",
  "peft==0.20.0",
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "evaluate==0.4.6",
  "huggingface-hub==1.27.0",
  "rouge-score==0.1.2",
  "bert-score==0.3.13",
  "numpy==2.5.2",
  "scipy>=1.14,<2",
  "matplotlib==3.11.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.15", "mypy>=1.19"]

[project.scripts]
crl-dialogue = "crl_prompt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
